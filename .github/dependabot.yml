# Dependabot keeps Go modules, the web frontend, GitHub Actions and the
# application image's base images current. Runtime images (images/php,
# images/node) derive their base tags from internal/runtime/*_versions.json
# and are updated by runtime-versions.yml instead.
#
# Updates are grouped so a solo maintainer gets one PR per ecosystem and
# week rather than a dozen; security updates still arrive individually.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    labels: [dependencies, go]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    labels: [dependencies, web]
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    labels: [dependencies, docker]
