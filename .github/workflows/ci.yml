name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The catalogue points at floating tags (postgres:18-alpine, redis:8-alpine …). An
  # upstream rebuild can therefore break what a new project gets without a commit of
  # ours, so the suite runs once a week as well.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests
        run: go test -race ./...
      - name: Docker integration tests
        # internal/project starts the stateful services (database, Redis, Memcached, Mailpit, RabbitMQ, Meilisearch, Typesense) with the
        # catalogue's default versions, which is what catches an upstream image changing
        # its layout under a new project. Every push checks PostgreSQL; the weekly run adds
        # MariaDB, MySQL and MongoDB, whose images are gigabytes.
        env:
          ENVORYX_TEST_ALL_DATABASES: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: go test -tags integration -count=1 -timeout 30m ./internal/docker/ ./internal/s3/ ./internal/project/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Browser tests against the real binary and a real Docker engine: first-run setup, sign-in,
  # wizard, running project, logs, delete (web/e2e). Needs the embedded frontend, so it builds
  # the whole thing first.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: make build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
