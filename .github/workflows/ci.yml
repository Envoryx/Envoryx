name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests
        run: go test -race ./...
      - name: Docker integration tests
        run: go test -tags integration -count=1 ./internal/docker/ ./internal/s3/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Browser tests against the real binary and a real Docker engine: first-run setup, sign-in,
  # wizard, running project, logs, delete (web/e2e). Needs the embedded frontend, so it builds
  # the whole thing first.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: make build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
