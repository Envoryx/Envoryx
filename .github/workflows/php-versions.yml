name: PHP version check

on:
  schedule:
    # Weekly, before the image rebuild (php-images.yml runs Mondays 04:00).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with upstream releases
        id: check
        run: python3 scripts/check-php-versions.py | tee /tmp/out.txt && grep '^changed=' /tmp/out.txt >> "$GITHUB_OUTPUT"
      - name: Open pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/php-versions
          title: "Update PHP versions"
          commit-message: "Update PHP versions from upstream releases"
          body: |
            Automated update of `internal/runtime/php_versions.json` based on
            endoflife.date and the php image tags on Docker Hub.

            Merging triggers the *PHP runtime images* workflow for the new matrix.
          labels: dependencies
