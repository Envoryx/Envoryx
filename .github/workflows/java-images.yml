name: Java runtime images

# The build is runtime-images.yml; this file says what and when.

on:
  push:
    branches: [main]
    paths:
      - "images/java/**"
      - "internal/runtime/java_versions.json"
      - ".github/workflows/java-images.yml"
      - ".github/workflows/runtime-images.yml"
      - "scripts/runtime-image-matrix.sh"
  # Daily: rebuilds the versions whose upstream image changed, and each one at least weekly.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      issues: write
    uses: ./.github/workflows/runtime-images.yml
    with:
      runtime: java
      version-arg: JAVA_VERSION
      bases: "eclipse-temurin:{base}"
