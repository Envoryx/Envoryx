name: Runtime version check

on:
  schedule:
    # Weekly, before the image rebuilds (php-images.yml starts Mondays at 04:00, the other
    # runtimes later).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare with upstream releases
        id: check
        run: |
          changed=false
          for p in php node python go ruby java dotnet; do
            python3 scripts/check-versions.py "$p" | tee /tmp/out-$p.txt
            grep -q '^changed=true' /tmp/out-$p.txt && changed=true
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/php-versions
          title: "Update runtime versions"
          commit-message: "Update PHP/Node/Python/Go/Ruby versions from upstream releases"
          body: |
            Automated update of `internal/runtime/*_versions.json` based on
            endoflife.date and the image tags on Docker Hub.

            Merging triggers the runtime image workflows for the new matrix.
          labels: dependencies
