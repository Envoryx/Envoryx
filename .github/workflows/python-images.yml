name: Python runtime images

on:
  push:
    branches: [main]
    paths:
      - "images/python/**"
      - "internal/runtime/python_versions.json"
      - ".github/workflows/python-images.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/envoryx/envoryx-python

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          matrix=$(jq -c '{include: [.versions[] | {version: .version, base: .base}]}' internal/runtime/python_versions.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # One native build per architecture (no QEMU: extensions compile at full speed).
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        version: ${{ fromJson(needs.matrix.outputs.matrix).include }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/python
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PYTHON_VERSION=${{ matrix.version.version }}
            BASE_TAG=${{ matrix.version.base }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=python-${{ matrix.version.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=python-${{ matrix.version.version }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.version.version }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.version.version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Combine the per-arch images into one multi-arch tag per version.
  merge:
    needs: [matrix, build]
    # Merge every version whose builds succeeded even if another version failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.matrix).include }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.version.version }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        run: |
          refs=""
          count=0
          for f in /tmp/digests/*; do [ -f "$f" ] || continue; refs="$refs ${IMAGE}@$(cat "$f")"; count=$((count+1)); done
          if [ "$count" -lt 2 ]; then echo "not all architectures built for ${{ matrix.version.version }}; keeping the previous tag"; exit 1; fi
          docker buildx imagetools create -t "${IMAGE}:${{ matrix.version.version }}" $refs
          docker buildx imagetools inspect "${IMAGE}:${{ matrix.version.version }}"
