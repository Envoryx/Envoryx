name: Python runtime images

# The build is runtime-images.yml; this file says what and when.
# The Dockerfile copies uv from ghcr.io/astral-sh/uv:0.12.

on:
  push:
    branches: [main]
    paths:
      - "images/python/**"
      - "internal/runtime/python_versions.json"
      - ".github/workflows/python-images.yml"
      - ".github/workflows/runtime-images.yml"
      - "scripts/runtime-image-matrix.sh"
  # Daily: rebuilds the versions whose upstream image changed, and each one at least weekly.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      issues: write
    uses: ./.github/workflows/runtime-images.yml
    with:
      runtime: python
      version-arg: PYTHON_VERSION
      bases: "python:{base} ghcr.io/astral-sh/uv:0.12"
