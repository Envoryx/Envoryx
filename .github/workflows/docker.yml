name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Signing the build provenance (Sigstore, through GitHub's OIDC token) and storing it.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for git describe

      # A release is its tag; a build of main says which release it follows and how far
      # (v0.10.0-3-g73304d6, as make build names local builds).
      - name: Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            v="${{ github.ref_name }}"
          else
            v="$(git describe --tags --match 'v*' --long --abbrev=7 2>/dev/null || echo "main-$(git rev-parse --short=7 HEAD)")"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub throttles the shared runners (429) and has outages; Google's
          # mirror of its library images answers instead, and BuildKit falls back to
          # Docker Hub for anything the mirror doesn't have.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/envoryx/envoryx
          # :latest follows releases; :main follows the development branch.
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and the full build provenance go into the image index, for scanners
          # and `docker buildx imagetools inspect`.
          sbom: true
          provenance: mode=max

      # GitHub signs the image's build provenance with a certificate naming this workflow
      # and the tag. Envoryx updates itself only to images with such a signature for the
      # version (internal/provenance); `gh attestation verify
      # oci://ghcr.io/envoryx/envoryx:<version> --repo Envoryx/Envoryx` checks it by hand.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/envoryx/envoryx
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Releases also go to Docker Hub, as a copy of the image just pushed.
  dockerhub:
    needs: build
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/dockerhub.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
