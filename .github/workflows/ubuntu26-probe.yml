name: Ubuntu 26 probe (temporary)

on:
  pull_request:

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: envoryx, context: ., args: "" }
          - { name: php, context: images/php, args: "PHP_VERSION=8.4\nBASE_TAG=8.4" }
          - { name: go, context: images/go, args: "GO_VERSION=1.27\nBASE_TAG=1.27-bookworm" }
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: cat /etc/os-release | head -3; docker version --format '{{.Server.Version}}'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          build-args: ${{ matrix.args }}
          push: false
