name: .NET runtime images

# The build is runtime-images.yml; this file says what and when.

on:
  push:
    branches: [main]
    paths:
      - "images/dotnet/**"
      - "internal/runtime/dotnet_versions.json"
      - ".github/workflows/dotnet-images.yml"
      - ".github/workflows/runtime-images.yml"
      - "scripts/runtime-image-matrix.sh"
  # Daily: rebuilds the versions whose upstream image changed, and each one at least weekly.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      issues: write
    uses: ./.github/workflows/runtime-images.yml
    with:
      runtime: dotnet
      version-arg: DOTNET_VERSION
      bases: "mcr.microsoft.com/dotnet/sdk:{base}"
