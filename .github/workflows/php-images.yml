name: PHP runtime images

# The build is runtime-images.yml; this file says what and when.
# The Dockerfile copies Node.js from node:24-bookworm-slim (NODE_VERSION) and Composer from
# composer:2.

on:
  push:
    branches: [main]
    paths:
      - "images/php/**"
      - "internal/runtime/php_versions.json"
      - ".github/workflows/php-images.yml"
      - ".github/workflows/runtime-images.yml"
      - "scripts/runtime-image-matrix.sh"
  # Daily: rebuilds the versions whose upstream image changed, and each one at least weekly.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      issues: write
    uses: ./.github/workflows/runtime-images.yml
    with:
      runtime: php
      version-arg: PHP_VERSION
      bases: "php:{base}-fpm node:24-bookworm-slim composer:2"
