name: PHP runtime images

on:
  push:
    branches: [main]
    paths:
      - "images/php/**"
      - ".github/workflows/php-images.yml"
  schedule:
    # Weekly rebuild picks up upstream PHP patch releases.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.6", base: "8.6-rc" } # preview: upstream publishes RC/beta under the -rc tag
          - { php: "8.5", base: "8.5" }
          - { php: "8.4", base: "8.4" }
          - { php: "8.3", base: "8.3" }
          - { php: "8.2", base: "8.2" }
          - { php: "8.1", base: "8.1" }
          - { php: "8.0", base: "8.0" }
          - { php: "7.4", base: "7.4" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/php
          platforms: linux/amd64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            BASE_TAG=${{ matrix.base }}
          tags: ghcr.io/seramos/staqio-php:${{ matrix.php }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
