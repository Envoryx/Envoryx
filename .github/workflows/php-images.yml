name: PHP runtime images

on:
  push:
    branches: [main]
    paths:
      - "images/php/**"
      - ".github/workflows/php-images.yml"
  schedule:
    # Weekly rebuild picks up upstream PHP patch releases.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.3", "8.2", "8.1", "8.0", "7.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/php
          platforms: linux/amd64
          push: true
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: ghcr.io/seramos/staqio-php:${{ matrix.php }}
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
