name: Node runtime images

on:
  push:
    branches: [main]
    paths:
      - "images/node/**"
      - "internal/runtime/node_versions.json"
      - ".github/workflows/node-images.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/seramos/staqio-node

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          matrix=$(jq -c '{include: [.versions[] | {version: .version, base: .base}]}' internal/runtime/node_versions.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # One native build per architecture (no QEMU: extensions compile at full speed).
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        version: ${{ fromJson(needs.matrix.outputs.matrix).include }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/node
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NODE_VERSION=${{ matrix.version.version }}
            BASE_TAG=${{ matrix.version.base }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=node-${{ matrix.version.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.version.version }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.version.version }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.version.version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Combine the per-arch images into one multi-arch tag per version.
  merge:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.matrix).include }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.version.version }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        run: |
          refs=""
          for f in /tmp/digests/*; do refs="$refs ${IMAGE}@$(cat "$f")"; done
          docker buildx imagetools create -t "${IMAGE}:${{ matrix.version.version }}" $refs
          docker buildx imagetools inspect "${IMAGE}:${{ matrix.version.version }}"
