name: Node runtime images

on:
  push:
    branches: [main]
    paths:
      - "images/node/**"
      - "internal/runtime/node_versions.json"
      - ".github/workflows/node-images.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          matrix=$(jq -c '{include: [.versions[] | {node: .version, base: .base}]}' internal/runtime/node_versions.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/node
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            BASE_TAG=${{ matrix.base }}
          tags: ghcr.io/seramos/staqio-node:${{ matrix.node }}
          cache-from: type=gha,scope=node-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}
