services:
  staqio:
    image: ghcr.io/seramos/staqio:latest
    # build:
    #   context: ..
    #   args:
    #     VERSION: dev
    container_name: staqio
    ports:
      - "8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/appdata/staqio:/config
      - /mnt/user/development:/projects
    environment:
      # Owner of files created inside project containers (Unraid default: nobody:users).
      PUID: 99
      PGID: 100
      # Host port range published for project web servers.
      STAQIO_PORT_RANGE_START: 20000
      STAQIO_PORT_RANGE_END: 20999
      # Optional: set explicitly if auto-detection of host paths fails.
      # STAQIO_PROJECTS_HOST_PATH: /mnt/user/development
      # STAQIO_CONFIG_HOST_PATH: /mnt/user/appdata/staqio
      # Optional: bootstrap the admin account non-interactively.
      # STAQIO_ADMIN_USER: admin
      # STAQIO_ADMIN_PASSWORD: change-me-please
      # Optional: use a Docker socket proxy instead of the raw socket (see SECURITY.md).
      # DOCKER_HOST: tcp://docker-socket-proxy:2375
    restart: unless-stopped
