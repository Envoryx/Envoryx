services:
  envoryx:
    image: ghcr.io/envoryx/envoryx:latest
    # build:
    #   context: ..
    #   args:
    #     VERSION: dev
    container_name: envoryx
    ports:
      - "8787:8787"
      # Embedded reverse proxy: projects by domain (http://shop.test) and HTTPS
      # via the local CA. Use other host ports if 80/443 are taken.
      - "80:80"
      - "443:443"
      # Embedded SSH server: PhpStorm/VS Code remote interpreter into project containers.
      - "2222:2222"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/appdata/envoryx:/config
      - /mnt/user/development:/projects
      # Optional: keep project backups off the appdata/cache share. Picked up
      # automatically when mounted; otherwise backups live in /config/backups.
      # - /mnt/user/backups/envoryx:/backups
    environment:
      # Owner of files created inside project containers (Unraid default: nobody:users).
      PUID: 99
      PGID: 100
      # Host port range published for project web servers.
      ENVORYX_PORT_RANGE_START: 20000
      ENVORYX_PORT_RANGE_END: 20999
      # Optional: set explicitly if auto-detection of host paths fails.
      # ENVORYX_PROJECTS_HOST_PATH: /mnt/user/development
      # ENVORYX_CONFIG_HOST_PATH: /mnt/user/appdata/envoryx
      # Optional: bootstrap the admin account non-interactively.
      # ENVORYX_ADMIN_USER: admin
      # ENVORYX_ADMIN_PASSWORD: change-me-please
      # Optional: change or disable (empty) the proxy listeners inside the container.
      # ENVORYX_PROXY_HTTP: ":80"
      # ENVORYX_PROXY_HTTPS: ":443"
      # ENVORYX_SSH: ":2222"
      # Optional: use a Docker socket proxy instead of the raw socket (see SECURITY.md).
      # DOCKER_HOST: tcp://docker-socket-proxy:2375
    restart: unless-stopped
